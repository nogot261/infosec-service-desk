{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><p class="section-label">Учет обращений</p><h1>Новая заявка</h1><p class="page-description">Опишите проблему, чтобы специалист мог приступить к ее решению.</p></div></div>
<section class="panel narrow" aria-labelledby="new-ticket-title">
  <div class="field-panel">
    <h2 id="new-ticket-title">Сведения об обращении</h2>
    <form method="post" action="/tickets" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="ticket-title">Тема заявки<input id="ticket-title" name="title" required minlength="5" maxlength="160" placeholder="Кратко укажите суть проблемы" autofocus></label>
      <div class="form-grid">
        <label for="ticket-category">Категория<select id="ticket-category" name="category" required>{% for key,label in categories.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label>
        <label for="ticket-priority">Приоритет<select id="ticket-priority" name="priority" required>{% for key,label in priorities.items() %}<option value="{{ key }}" {% if key=='normal' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
      </div>
      <label for="ticket-asset">Средство защиты <span class="hint">Если обращение связано с конкретным объектом</span>
        <select id="ticket-asset" name="asset_id"><option value="">Не выбрано</option>{% for asset in assets %}<option value="{{ asset.id }}">{{ asset.inventory_no }} - {{ asset.name }}</option>{% endfor %}</select>
      </label>
      <label for="ticket-description">Описание проблемы
        <textarea id="ticket-description" name="description" rows="6" required minlength="10" maxlength="4000" placeholder="Когда возникла проблема, как она проявляется и что уже предпринималось"></textarea>
        <span class="hint">Не указывайте пароли, ключи и другие секретные данные.</span>
      </label>
      <div class="form-actions"><button class="primary" type="submit">Зарегистрировать заявку</button><a class="button secondary" href="/tickets">Отмена</a></div>
    </form>
  </div>
</section>
{% endblock %}
