{% extends 'base.html' %}{% block content %}
<h1>Сообщения посетителей</h1><section class="panel"><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Имя</th><th>Email</th><th>Тема</th><th>Сообщение</th><th>Статус</th></tr></thead><tbody>{% for item in items %}<tr><td>{{item.created_at}}</td><td>{{item.sender_name}}</td><td>{{item.sender_email}}</td><td>{{item.subject}}</td><td>{{item.body}}</td><td>{{item.state}}{% if item.state=='new' %}<form method="post" action="/admin/feedback/{{item.id}}/processed"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button type="submit">Обработано</button></form>{% endif %}</td></tr>{%endfor%}</tbody></table></div></section>{% endblock %}
