{% extends 'base.html' %}{% block content %}
<h1>Обратная связь</h1><p class="page-description">Вопросы о работе службы. Не передавайте пароли и закрытые сведения.</p>
<section class="panel"><form class="stack" action="/feedback" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Имя<input name="sender_name" required maxlength="100"></label>
<label>Электронная почта<input type="email" name="sender_email" required maxlength="140"></label>
<label>Тема<input name="subject" required maxlength="140"></label>
<label>Сообщение<textarea name="body" required minlength="10" maxlength="3000"></textarea></label>
<button class="primary" type="submit">Отправить</button></form></section>{% endblock %}
