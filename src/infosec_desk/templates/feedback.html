{% extends 'base.html' %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Обратная связь</h1>
    <p class="page-description">Вопросы о работе службы. Не передавайте пароли и закрытые сведения.</p>
  </div>
</div>
<section class="panel form-card" aria-label="Форма обратной связи">
  <div class="panel-body">
    <form class="stack" action="/feedback" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="feedback-name">Имя
        <input id="feedback-name" name="sender_name" autocomplete="name" required maxlength="100">
      </label>
      <label for="feedback-email">Электронная почта
        <input id="feedback-email" type="email" name="sender_email" autocomplete="email" required maxlength="140">
      </label>
      <label for="feedback-subject">Тема
        <input id="feedback-subject" name="subject" required maxlength="140">
      </label>
      <label for="feedback-body">Сообщение
        <textarea id="feedback-body" name="body" rows="5" required minlength="10" maxlength="3000"></textarea>
      </label>
      <div class="form-actions"><button class="primary" type="submit">Отправить сообщение</button></div>
    </form>
  </div>
</section>
{% endblock %}
