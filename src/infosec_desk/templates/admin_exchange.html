{% extends 'base.html' %}
{% block content %}
<h1>Обмен справочником СЗИ</h1>
<section class="panel">
  <h2>Выгрузка справочника</h2>
  <p>Скачать действующие и архивные средства защиты в файле JSON.</p>
  <p><a class="button secondary" href="/admin/assets.json">Скачать JSON</a></p>
</section>
<section class="panel">
  <h2>Загрузка справочника</h2>
  <p>При импорте добавляются только новые инвентарные номера. Существующие записи не изменяются.</p>
  <form method="post" action="/admin/assets.json" enctype="multipart/form-data" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Файл JSON размером до 2 МБ
      <input type="file" name="assets_file" accept="application/json,.json" required>
    </label>
    <button type="submit">Импортировать</button>
  </form>
</section>
{% endblock %}
