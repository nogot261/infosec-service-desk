{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div><h1>Настройки службы</h1>
  <p class="page-description">Общие сведения, которые отображаются пользователям.</p>
</div></div>
<section class="panel narrow" aria-label="Настройки службы">
  <div class="panel-body">
    <form method="post" action="/admin/settings" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="setting-title">Название сайта
        <input id="setting-title" name="site_title" value="{{ settings.site_title }}" required>
      </label>
      <label for="setting-email">Почта поддержки
        <input id="setting-email" name="help_email" type="email" value="{{ settings.help_email }}" required>
      </label>
      <label for="setting-hours">Время работы
        <input id="setting-hours" name="office_hours" value="{{ settings.office_hours }}" required>
      </label>
      <div class="form-actions"><button class="primary" type="submit">Сохранить настройки</button></div>
    </form>
  </div>
</section>
{% endblock %}
