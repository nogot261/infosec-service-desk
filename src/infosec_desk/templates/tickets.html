{% extends "base.html" %}
{% block content %}
<div class="heading-row"><div><div class="eyebrow">ОБРАБОТКА ОБРАЩЕНИЙ</div><h1>Заявки</h1><p class="muted">Поиск и контроль исполнения</p></div><a class="primary button" href="/tickets/new">+ Новая заявка</a></div>
<section class="panel"><form class="filters" method="get" action="/tickets">
<label class="grow">Поиск<input name="q" placeholder="Номер, тема, описание" value="{{ search }}"></label>
<label>Статус<select name="status"><option value="">Все статусы</option>{% for k,v in statuses.items() %}<option value="{{ k }}" {{ 'selected' if status_filter==k else '' }}>{{ v }}</option>{% endfor %}</select></label>
<button class="secondary">Найти</button><a href="/tickets" class="button secondary">Сбросить</a>
</form><div class="table-wrap">{% include '_table.html' %}</div></section>
{% if user.role != 'requester' %}<p class="minor-link"><a href="/export.csv">Скачать реестр заявок в CSV</a></p>{% endif %}
{% endblock %}
