[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infosec-service-desk"
version = "2.0.0"
description = "Система учета заявок на обслуживание систем защиты информации"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.2",
    "openpyxl==3.1.5",
    "Jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff>=0.6,<1.0"]

[project.scripts]
infosec-desk = "infosec_desk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infosec_desk = ["templates/*.html", "static/*.css", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
